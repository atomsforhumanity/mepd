  - id: furan_maleimide
    name: Furan + maleimide Diels-Alder, kinetic endo vs thermodynamic exo (retro-Diels-Alder)
    chemistry: bimolecular pericyclic [4+2], reversible; closed-shell multistep (endo forms, reverts, exo accumulates)
    split: tune
    phase: solution
    scorable: provisional
    atoms: 19
    reactants:
      - {name: furan, smiles: "c1ccoc1", charge: 0, multiplicity: 1}
      - {name: maleimide, smiles: "O=C1C=CC(=O)N1", charge: 0, multiplicity: 1}
    conditions:
      temperature_range_K: [300, 300]
      score_temperature_K: 300
      solvent: null
      solvent_note: "not stated in the abstract; full text and SI not reachable (MPG.PuRe copies are MPG-network only)"
      time_scale_s: [1.0e3, 1.0e6]
      score_time_s: null
      standard_state: 1M
    channels:
      endo: {products: ["O=C1NC(=O)[C@H]2[C@@H]1[C@H]1C=C[C@@H]2O1"], racemic: false, radical: false, note: "meso; the kinetic adduct, reverts by retro-Diels-Alder"}
      exo: {products: ["O=C1NC(=O)[C@H]2[C@@H]1[C@@H]1C=C[C@H]2O1"], racemic: false, radical: false, note: "meso; the thermodynamic adduct"}
    target:
      quantity: k-ratio
      numerator: [endo]
      denominator: [exo]
      value: 1.399
      range: [1.318, 1.480]
      range_basis: >-
        Initial formation rate constants at 300 K (Rulisek 2005 abstract): k_endo = (1.93 +- 0.082)e-5 and
        k_exo = (1.38 +- 0.055)e-5 L mol-1 s-1, so k_endo/k_exo = 1.40 +- 0.08 (first-order propagation).
        Second, qualitative target: at long times exo is the dominant product (retro-Diels-Alder of endo).
      rt_ln_kcal_mol: {at_K: 300, value: 0.200, range: [0.165, 0.234]}
      long_time: "exo dominant (qualitative, CONFIRMED in the abstract); no measured endo:exo at a stated time"
      status: "values CONFIRMED (abstract); solvent, concentrations and the kinetic scheme behind the k values UNCONFIRMED"
    references:
      - doi: 10.1021/jo050759z
        citation: "L. Rulíšek, P. Šebek, Z. Havlas, R. Hrabal, P. Čapek, A. Svatoš, J. Org. Chem. 70 (2005) 6295-6302"
        read: abstract (PubMed 16050690); full text and SI paywalled or MPG-network only
        used_for: rate constants, kinetic vs thermodynamic outcome
        passages:
          - where: Abstract
            text: "The experimental values of rate constants (k(1+2endo) = (1.75 +/- 0.48) x 10(-5); mol(-1) l s(-1); k(1+2exo) = (3.10 +/- 0.55) x 10(-5); mol(-1) l s(-1); k(1+3endo) = (1.93 +/- 0.082) x 10(-5); mol(-1) l s(-1), k(1+3exo) = (1.38 +/- 0.055) x 10(-5); mol(-1) l s(-1) all at 300 K)"
            note: "1 = furan, 2 = maleic anhydride, 3 = maleimide"
          - where: Abstract
            text: "The low thermodynamic stability of furan [4 + 2] adducts opens retro-Diels-Alder reaction channels and overrules the very small kinetic preference (calculated and measured here) of initial formation for endo stereoisomers. On a macroscopic scale \"an irregular\"-thermodynamically more stable-exo stereoisomer was consequently observed as a dominant species."
        status: CONFIRMED (abstract values); conditions UNCONFIRMED
      - doi: 10.1039/d5sc06724c
        citation: "C.B. Lennox, C.R. Taylor, I. Huskić, J. Vainauskas, C.W. Nickels, R.S. Stein, T.H. Borchers, A.R.B.J. Lutton-Gething, J.M. Marrett, G.M. Day, T. Friščić, Chem. Sci. 17 (2026) 15432-15442"
        read: full text (Europe PMC PMC13321552); SI not retrieved
        used_for: the state of the experimental literature on furan + maleic anhydride (sibling system); not a target
        passages:
          - where: Introduction (secondary summary of the literature)
            text: "Lee and Herndon have indicated that the initial rate of formation for endo-1 is ca. 500 times higher compared to that of exo-1,20 with the final isolated product being the result of rapid endo-to exo-1 conversion. Koreshkov et al.21 have found that the rates of formation of endo- and exo-1 are comparable, while González and López-Ortiz have also observed the preferred formation of endo-1.22 More recently, the Svatoš group has observed comparable initial rates of formation for both isomers, with endo-1 subsequently converting into the exo-form.23"
          - where: Results (own measurement, neat, solidifying mixture)
            text: "The 1H NMR analysis of an extracted sample of the product dissolved in CD3CN revealed two major sets of signals, one corresponding to exo-1, while the second one was consistent with chemical shifts reported for endo-1.28,29 In addition to these signals, which indicated a ratio of endo-1 and exo-1 of ca. 2 : 7"
        status: CONFIRMED (text read); neat solid-forming conditions, so not used as a target
      - doi: 10.1038/s41598-019-54156-4
        citation: "Widstrom and Lear, Sci. Rep. (2019), retro-Diels-Alder kinetics of furan-maleic anhydride and furan-N-methylmaleimide adducts by 1H NMR"
        read: full text and SI (by the source agent, not re-read by the curator)
        used_for: lead only; rate-constant units not stated and the isomer measured was not assigned experimentally
        status: not used
    fair_comparison:
      - "Reversibility is the point: the explorer's kinetics must include retro-Diels-Alder of both adducts; the initial ratio tests the forward TSs, the long-time exo dominance tests the thermodynamics and the reverse steps."
      - "The solvent of the measurement is not known (full text unread). Do not promote to scorable before the conditions are confirmed."
      - "The literature disagrees on the sibling furan + maleic anhydride (endo 500x faster initially per Lee and Herndon 1978 vs comparable rates per Koreshkov 1989 and Rulisek 2005; all secondary here), which is why maleic anhydride is not the target."

