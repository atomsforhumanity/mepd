  - id: cb_diester
    name: Electrocyclic ring opening of dimethyl cis-cyclobut-3-ene-1,2-dicarboxylate, (2Z,4E) vs (2E,4E) diene
    chemistry: unimolecular pericyclic rearrangement (4-electron electrocyclic ring opening), stereospecificity
    split: held-out
    phase: liquid (neat)
    scorable: true
    atoms: 22
    reactants:
      - {name: dimethyl cis-cyclobut-3-ene-1,2-dicarboxylate, smiles: "COC(=O)[C@H]1C=C[C@H]1C(=O)OC", charge: 0, multiplicity: 1}
    conditions:
      temperature_range_K: [363.15, 363.15]
      score_temperature_K: 363.15
      solvent: neat (6 µm film between SiOx-coated ZnSe windows, "non-cavity" control)
      time_scale_s: 7200
      score_time_s: 7200
      standard_state: 1M
      conversion: "incomplete after 2 h (unreacted CB remains); k_obs = 0.0120 min-1 at 90 °C"
    channels:
      conrotatory_ZE: {products: ["COC(=O)/C=C\\C=C\\C(=O)OC"], radical: false, note: "dimethyl (2Z,4E)-muconate, 'cis-trans', Woodward-Hoffmann allowed"}
      EE: {products: ["COC(=O)/C=C/C=C/C(=O)OC"], radical: false, note: "dimethyl (2E,4E)-muconate, 'trans-trans'; assigned by the authors to the forbidden disrotatory path"}
    target:
      quantity: yield-ratio
      numerator: [conrotatory_ZE]
      denominator: [EE]
      value: null
      range: [12.2, null]
      range_basis: >-
        One-sided. Measured (Z,E):(E,E) = 12.7 +- 0.5 (92 % : 8 %) after 2 h at 90 °C. The authors assign the (E,E) to
        a disrotatory TS only 7.6 kJ/mol above the conrotatory one, against 35-40 kJ/mol for cis-3,4-dimethylcyclobutene
        (their own comparison). A trans-isomer impurity or surface chemistry in the 6 µm cell isn't excluded in the text
        read, so only the lower bound 12.7 - 0.5 is scored. A two-sided reading (12.2-13.2, RT ln 1.81-1.86 kcal/mol)
        needs the SI (reactant purity) first.
      rt_ln_kcal_mol: {at_K: 363.15, value: null, range: [1.805, null]}
      status: CONFIRMED (value read in the primary text; the mechanism of the minor product is the authors' interpretation)
    references:
      - doi: 10.1002/anie.202013465
        citation: "A. Sau, K. Nagarajan, B. Patrahau, L. Lethuillier-Karl, R.M.A. Vergauwe, A. Thomas, J. Moran, C. Genet, T.W. Ebbesen, Angew. Chem. Int. Ed. 60 (2021) 5712"
        read: full text (Europe PMC PMC7986062; read by the source agent, quotes re-checked by the curator); SI not read
        used_for: the non-cavity (ordinary thermal) control only; the vibrational-strong-coupling results are not targets
        passages:
          - where: Results, non-cavity conditions
            text: "Electrocyclic ring‐opening of CB was performed by heating the sample at 90 °C for two hours (Figure 2 a). To begin, we followed the reaction under non‐cavity conditions (Figure S2, Supporting Information). Neat CB was injected into the preheated chamber at 90 °C and the reaction was monitored in the FT‐IR (Figure 2 b)."
          - where: Results, non-cavity conditions
            text: "After two hours, the reaction mixture was allowed to cool to room temperature (RT) and dissolved in CDCl3 to perform the 1H‐NMR measurement."
          - where: Results, non-cavity conditions
            text: "As predicted by the WH rules, the symmetry‐allowed cis‐trans butadiene is obtained as the major product (92 %) while the symmetry‐forbidden trans‐trans derivative is present only with a 8 % yield. This leads to a ratio between symmetry‐allowed conrotatory (cis‐trans) vs. symmetry‐forbidden disrotatory (trans‐trans) product ratio of 12.7±0.5. No other products or intermediates were observed in the NMR spectra."
          - where: Table 1 (cis-trans/trans-trans | ΔΔG‡ kJ/mol)
            text: "Non‐cavity | 12.7±0.5 | 7.7±0.2"
          - where: Discussion
            text: "In non‐cavity conditions, the average free energy change between con‐ and disrotatory transition states of CB at 90 °C is 7.6±0.2 kJ mol−1, which is much lower when compared to cis‐3,4‐dimethylcyclobutene (35–40 kJ mol−1)."
          - where: Results
            text: "The rate of formation of cis‐trans and trans‐trans butadiene under non‐cavity conditions at 90 °C was 0.011 min−1 and 0.001 min−1 respectively."
        status: CONFIRMED
    fair_comparison:
      - "Stereospecificity test: the explorer must find the conrotatory path to the (2Z,4E) diene and predict it dominant; product matching must keep C=C stereo (isomeric SMILES)."
      - "One-sided on purpose: a TST search will put a true disrotatory TS far higher than 7.6 kJ/mol, so a two-sided 12.7 would punish a correct stereospecific prediction if the 8 % (E,E) is an artefact."
      - "Neat liquid at 90 °C, thin film: no solvent model is needed for the selectivity, but surface effects in the 6 µm cell cannot be excluded."
      - "Held out: the only rearrangement in the ladder; never tune on it."
