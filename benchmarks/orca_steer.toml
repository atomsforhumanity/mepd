# Steering level for the explorer (F0007, HCOOH): wB97X-D3BJ/def2-TZVP (RIJCOSX) single points in ORCA 6.0.0,
# one process each (no MPI on this machine); the explorer runs several side by side. ORCA is found by
# mepd.engines.orca: $MEPD_ORCA, /opt/orca/orca (the cluster images), or `orca` on PATH.
engine_name = "orca"
[orca_engine_kwds]
method = "wB97X-D3BJ"
basis = "def2-TZVP"
threads = 1
maxcore = 3000
