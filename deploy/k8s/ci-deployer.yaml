# The account CI deploys with (.github/workflows/build-deploy.yml): it can
# change mepd's Deployment, Service and Ingress in the `mepd` namespace, follow
# a rollout and undo it -- nothing else, and nothing outside the namespace (no
# Secrets, no nodes). Not part of kustomization.yaml: a cluster admin applies it
# once (`kubectl apply -f deploy/k8s/ci-deployer.yaml`); see deploy/k8s/README.md
# for turning its token into the kubeconfig CI uses.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: mepd

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: mepd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]             # `rollout status` and `rollout undo` read them
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: mepd
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: mepd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer

---
# A long-lived token for the account (Kubernetes fills in `data.token`).
# Delete this Secret to revoke it; re-apply this file for a new one.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: mepd
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
