# mepd web in demo mode on afh-c04: one FastAPI process (it holds state, so
# one replica), the GPU, and its state on the node's data disk.
#
# Before the first apply (see deploy/k8s/README.md):
#   on afh-c04:   sudo mkdir -p /nvme1/mepd/data /nvme1/mepd/tmp && sudo chown -R 1000:1000 /nvme1/mepd
#   kubectl create namespace mepd
#   kubectl -n mepd create secret docker-registry ghcr-pull --docker-server=ghcr.io \
#     --docker-username=<github user> --docker-password=<classic PAT, read:packages only>
#
#   kubectl apply -k deploy/k8s        (normally CI does this: .github/workflows/build-deploy.yml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mepd
  namespace: mepd
  labels: {app: mepd}
spec:
  replicas: 1
  # A new version starts beside the old one, which stops only once the new one
  # is ready: no downtime. For that minute both servers see the same workspaces;
  # the new one shows the old one's running jobs as interrupted (resumable),
  # which they become anyway when the old pod stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: mepd}
  template:
    metadata:
      labels: {app: mepd}
    spec:
      nodeSelector:
        kubernetes.io/hostname: afh-c04      # the data lives on this node's disk
      imagePullSecrets:
        - name: ghcr-pull
      # Kubernetes otherwise sets <SERVICE>_PORT etc. for every Service in the
      # namespace: the Service `mepd` gave MEPD_PORT=tcp://...:80, which
      # overrides the image's MEPD_PORT (the server's port) and stops it.
      enableServiceLinks: false
      # The NVIDIA container runtime injects the GPU devices and driver; the
      # default runtime ignores NVIDIA_VISIBLE_DEVICES (set below).
      runtimeClassName: nvidia
      # Jobs stop with the pod; the next server marks them interrupted, and
      # they resume where they left off. A minute lets requests finish.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: mepd
          image: ghcr.io/atomsforhumanity/mepd       # tag: kustomization.yaml (set by CI)
          args: ["serve"]
          env:
            # The GPU, without reserving it (no nvidia.com/gpu request): the
            # device plugin would hand the node's one GPU to one pod, and the new
            # pod of a rolling update would wait for it forever.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: MEPD_MODE
              value: demo
            # The demo does not limit compute (mepd/web/demo.py, DemoPolicy.limit_compute,
            # off since 2026-11-10): no caps on sizes, operations or run times. Work only
            # queues: each calculation uses one core (OMP_NUM_THREADS=1), so 64 at once
            # fill the node's 64 cores.
            - name: MEPD_DEMO_GLOBAL_CONCURRENCY   # running, across all testers
              value: "64"
            - name: MEPD_MAX_JOBS                  # running, per workspace (the rest wait)
              value: "8"
            - name: MEPD_DEMO_SANDBOX              # interactive reactors at once
              value: '{"total": 8}'
          ports:
            - name: http
              containerPort: 8765
          volumeMounts:
            - name: data                       # workspaces, jobs, logins: everything kept
              mountPath: /data
            - name: tmp                        # GSM/Psi4 scratch: the data disk, not the OS disk
              mountPath: /tmp
            - name: shm                        # PyTorch worker processes share memory here
              mountPath: /dev/shm
          resources:
            # Reserve little, use what's free: mepd is mostly idle, and the node
            # is for other work too. No CPU limit, so it can use all 64 cores;
            # memory up to 224 of 256 GB, leaving room for the OS and Kubernetes.
            # The node may be oversubscribed; we accept that over idle reservations.
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 224Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 5
            failureThreshold: 60               # up to 5 min to start
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5                # a busy server is not a dead one
      volumes:
        - name: data
          hostPath: {path: /nvme1/mepd/data, type: Directory}
        - name: tmp
          hostPath: {path: /nvme1/mepd/tmp, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}

---
apiVersion: v1
kind: Service
metadata:
  name: mepd
  namespace: mepd
spec:
  type: ClusterIP
  selector: {app: mepd}
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mepd
  namespace: mepd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: mepd.afh.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mepd
                port: {name: http}
